name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v5
        with:
          # Not `go-version-file: go.mod`. That resolves to exactly the go
          # directive — 1.25.0 — whose standard library govulncheck reports as
          # vulnerable, and which is older than the Go some tools are built
          # with. The directive stays the language floor; this is the toolchain.
          go-version: 'stable'
          cache: true

      - name: gofmt
        run: |
          unformatted=$(gofmt -l ./cmd ./internal ./pkg)
          if [ -n "$unformatted" ]; then
            echo "These files are not gofmt-clean:"
            echo "$unformatted"
            exit 1
          fi

      - name: go mod tidy is current
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum

      - name: go vet
        run: go vet ./...

      - uses: golangci/golangci-lint-action@v9
        with:
          # v9 is the first line of the action that installs golangci-lint v2,
          # which is what .golangci.yml is written for. The action's own v6
          # installs v1.64, and v1 reads a v2 config as a config error.
          version: v2.13.1

  architecture:
    # The rules that keep the design from decaying, run as their own job so a
    # boundary violation is visible without reading the test output.
    name: Architecture rules
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v5
        with:
          # See the Lint job: the go.mod directive is the language floor,
          # not the toolchain to build with.
          go-version: 'stable'
          cache: true
      - run: go test -v ./internal/arch/...

  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v5
        with:
          # See the Lint job: the go.mod directive is the language floor,
          # not the toolchain to build with.
          go-version: 'stable'
          cache: true
      - name: Test with race detector
        # bash on every OS, deliberately. The Windows runner's default shell
        # is pwsh, which splits `-coverprofile=coverage.out` at the dot and
        # passes `.out` to the go tool as a package path.
        shell: bash
        run: go test -race -shuffle=on -coverprofile=coverage.out ./...
      - name: Coverage gate
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: |
          total=$(go tool cover -func=coverage.out | tail -1 | awk '{print substr($3, 1, length($3)-1)}')
          echo "total coverage: $total%"
          # The gate exists from day one because the prototype reached five
          # tested packages out of eighteen by never having one.
          awk -v t="$total" 'BEGIN { exit (t >= 45) ? 0 : 1 }' || {
            echo "coverage $total% is below the 45% gate"
            exit 1
          }

  shell-matrix:
    # The claim that a shell is "Full class" is only worth what a live session
    # says about it. This job sources the real hook into each shell, runs a
    # command that fails, and asserts the record — which is the one thing the
    # unit tests structurally cannot do.
    name: Shell matrix (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v5
        with:
          # See the Lint job: the go.mod directive is the language floor,
          # not the toolchain to build with.
          go-version: 'stable'
          cache: true

      - name: Install the shells (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq zsh fish ksh dash elvish xonsh
          # nushell is not packaged, so take it from a pinned release. A
          # failure here leaves nu reported as SKIP, which is honest; it must
          # never leave it reported as PASS.
          curl -fsSL -o /tmp/nu.tar.gz https://github.com/nushell/nushell/releases/download/0.99.1/nu-0.99.1-x86_64-unknown-linux-gnu.tar.gz || true
          tar -xzf /tmp/nu.tar.gz -C /tmp || true
          sudo cp /tmp/nu-*/nu /usr/local/bin/ 2>/dev/null || true

      - name: Install the shells (macOS)
        if: runner.os == 'macOS'
        run: brew install fish nushell elvish xonsh || true

      - name: Build
        run: go build -o build/wut ./cmd/wut

      - name: POSIX shells
        if: runner.os != 'Windows'
        run: bash scripts/shell-matrix.sh

      - name: PowerShell hosts
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          go build -o build/wut.exe ./cmd/wut
          ./scripts/shell-matrix.ps1

  eval:
    # E1 and E3 — is the answer engine any good, as opposed to does it work.
    # E1 needs a real index, so this job builds one; without it the benchmark
    # skips, and a benchmark that silently skips is a benchmark nobody reads.
    name: Benchmarks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v5
        with:
          # See the Lint job: the go.mod directive is the language floor,
          # not the toolchain to build with.
          go-version: 'stable'
          cache: true
      # The corpus is pinned by digest, not fetched fresh.
      #
      # tldr-pages republishes tldr.zip in place under a tag that has not moved
      # since 2025, so `db sync` returns a different corpus from one day to the
      # next. E1 asserts a floor, and a floor measured against a moving input
      # goes red without anybody changing a line of code — which is exactly
      # what it did. The cache holds the pinned bytes; the digest check says so
      # when it no longer can.
      - name: Restore the pinned tldr corpus
        id: corpus
        uses: actions/cache@v4
        with:
          path: tldr.zip
          key: tldr-corpus-${{ hashFiles('internal/eval/testdata/corpus.sha256') }}
      - name: Fetch the corpus
        if: steps.corpus.outputs.cache-hit != 'true'
        run: curl -sSLo tldr.zip https://github.com/tldr-pages/tldr/releases/latest/download/tldr.zip
      - name: Check the corpus against the pin
        run: |
          if sha256sum -c internal/eval/testdata/corpus.sha256; then
            echo "corpus matches the pin"
          else
            echo "::warning::tldr.zip no longer matches internal/eval/testdata/corpus.sha256."
            echo "::warning::E1 will report its numbers without gating on them. Review them and re-pin."
            echo "WUT_EVAL_CORPUS_UNPINNED=1" >> "$GITHUB_ENV"
          fi
      - name: Build the knowledge index
        run: |
          go build -o build/wut ./cmd/wut
          ./build/wut db sync --from-archive tldr.zip
      - name: E1 retrieval and E3 grounding
        run: go test -v ./internal/eval/...

  security:
    name: Security
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v5
        with:
          # See the Lint job: the go.mod directive is the language floor,
          # not the toolchain to build with.
          go-version: 'stable'
          cache: true
      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

  build:
    name: Build ${{ matrix.goos }}/${{ matrix.goarch }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - { goos: linux, goarch: amd64 }
          - { goos: linux, goarch: arm64 }
          - { goos: darwin, goarch: amd64 }
          - { goos: darwin, goarch: arm64 }
          - { goos: windows, goarch: amd64 }
          - { goos: windows, goarch: arm64 }
          - { goos: freebsd, goarch: amd64 }
          - { goos: openbsd, goarch: amd64 }
          - { goos: netbsd, goarch: amd64 }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v5
        with:
          # See the Lint job: the go.mod directive is the language floor,
          # not the toolchain to build with.
          go-version: 'stable'
          cache: true
      - name: Cross-compile
        # CGO_ENABLED=0 is not incidental. The whole matrix builds from one
        # runner only while the binary stays free of cgo, which is also why
        # the optional model runtime is a separate downloaded artifact rather
        # than a linked library.
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0
        run: go build -trimpath -ldflags "-s -w" -o /dev/null ./cmd/wut

  ci-passed:
    name: CI passed
    runs-on: ubuntu-latest
    needs: [lint, architecture, test, shell-matrix, eval, security, build]
    if: always()
    steps:
      - name: Check results
        run: |
          if [ "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}" = "true" ]; then
            exit 1
          fi
