name: Release

# GoReleaser is the single release path. The previous hand-written matrix
# duplicated build and packaging logic that .goreleaser.yaml already described,
# and shipped without checksums, SBOM, or signatures.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag_name:
        description: Git tag to release (must already exist)
        required: true
        type: string
      dry_run:
        description: Build and package without publishing
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # The release must not be able to ship code that fails its own gates.
  verify:
    name: Verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Check formatting
        run: |
          set -euo pipefail
          unformatted="$(gofmt -l . | grep -v '^dist/' | grep -v '^build/' || true)"
          if [ -n "$unformatted" ]; then
            echo "::error::Not gofmt-clean: $unformatted"
            exit 1
          fi

      - name: Run vet
        run: go vet ./...

      - name: Run tests with race detector
        run: go test -race ./...

      - name: Run govulncheck
        uses: golang/govulncheck-action@v1
        with:
          go-version-file: go.mod

  release:
    name: Build and publish
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write # create the GitHub release
      packages: write # push container images to ghcr.io
      id-token: write # keyless cosign signing + build provenance
      attestations: write
    steps:
      - uses: actions/checkout@v7
        with:
          # GoReleaser derives the changelog from history, so it needs all of it.
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag_name || github.ref }}

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to ghcr.io
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Produces the CycloneDX SBOM that .goreleaser.yaml's `sboms` block calls.
      - name: Install syft
        uses: anchore/sbom-action/download-syft@v0

      # Keyless signing: the signing identity is this workflow's OIDC token, so
      # no private key is stored anywhere.
      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      # Prefer the curated CHANGELOG section over commit-derived notes. The
      # script falls back to generated notes when the section is missing.
      - name: Build release notes from CHANGELOG
        env:
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag_name || github.ref_name }}
        run: bash ./.github/scripts/release_notes.sh CHANGELOG.md "$RELEASE_TAG" release-notes.md

      # Optional publishers are skipped when their credentials are absent, so a
      # release never fails because a downstream package feed is unconfigured.
      - name: Decide which publishers to skip
        id: skip
        env:
          CHOCOLATEY_API_KEY: ${{ secrets.CHOCOLATEY_API_KEY }}
        run: |
          set -euo pipefail
          skips=()
          if [ -z "${CHOCOLATEY_API_KEY:-}" ]; then
            echo "::notice::CHOCOLATEY_API_KEY not set - skipping the Chocolatey publisher."
            skips+=("chocolatey")
          fi
          if [ "${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}" = "true" ]; then
            skips+=("publish" "announce")
          fi
          if [ ${#skips[@]} -eq 0 ]; then
            echo "flags=" >> "$GITHUB_OUTPUT"
          else
            printf 'flags=--skip=%s\n' "$(IFS=,; echo "${skips[*]}")" >> "$GITHUB_OUTPUT"
          fi

      - name: Run GoReleaser
        id: goreleaser
        uses: goreleaser/goreleaser-action@v7
        with:
          version: "~> v2"
          args: release --clean --release-notes=release-notes.md ${{ steps.skip.outputs.flags }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CHOCOLATEY_API_KEY: ${{ secrets.CHOCOLATEY_API_KEY }}

      # SLSA build provenance, verifiable with `gh attestation verify`.
      - name: Attest build provenance
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: |
            dist/*.tar.gz
            dist/*.zip
            dist/checksums.txt

      - name: Upload release artifacts for inspection
        uses: actions/upload-artifact@v7
        with:
          name: release-dist
          path: |
            dist/*.tar.gz
            dist/*.zip
            dist/checksums.txt*
            dist/*.sbom.json
          if-no-files-found: warn
          retention-days: 14
