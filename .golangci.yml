# Linters chosen for the defect classes the prototype audit actually found, not
# for a maximal list. Each one below has a finding behind it, and each
# exclusion below says why it is not one.
version: "2"

run:
  timeout: 5m

linters:
  default: standard
  enable:
    # The prototype leaked HTTP response bodies in the sync path.
    - bodyclose
    # The prototype used a client-wide 5s timeout for a multi-megabyte
    # download, so `wut db sync` could not finish on a normal connection.
    # noctx and contextcheck catch the shape of that mistake.
    - noctx
    - contextcheck
    # The prototype compared errors by string in places and swallowed them in
    # others.
    - errorlint
    - nilerr
    # The tool touches rc files, spawns probes, and reads untrusted output.
    - gosec
    # Dead parameters and forgotten assignments were how the performance
    # package accumulated 2,000 unreferenced lines.
    - unparam
    - wastedassign
    - unconvert
    - misspell
    - revive

  settings:
    gosec:
      excludes:
        # G204 flags every exec.Command. The fact prober is the one place that
        # is allowed, and it is guarded by an argv-exact allowlist plus an AST
        # test in internal/arch that fails the build if os/exec appears
        # anywhere else. That is a stronger guarantee than this linter can
        # express.
        - G204
        # G304 and G703 flag opening a path that came from a variable. Opening
        # the path the user configured is the product: the config file, the
        # index, the rc file. The real guarantee is that those paths are
        # resolved by internal/platform/paths and that session ids are
        # sanitised before they can name a file — both of which are tested.
        - G304
        - G703
        # G115 flags integer conversions. Every one is in the index codec or
        # the daemon's length prefix, where the width is the format and the
        # bound is checked before the conversion. Silencing it here is honest;
        # what would not be is silencing it project-wide, which is why the
        # index and protocol tests assert the round trips instead.
        - G115

    errcheck:
      # A deferred Close on a file already read has no error worth acting on,
      # and a failed write to a terminal cannot be reported anywhere but that
      # terminal. Closes that matter — the ones on a file being written — are
      # checked explicitly in configstore, the index writer, and the event
      # store, and the atomic-write tests assert the result rather than the
      # return value.
      exclude-functions:
        - (io.Closer).Close
        - (*os.File).Close
        - fmt.Fprint
        - fmt.Fprintf
        - fmt.Fprintln
        - os.Remove

    revive:
      rules:
        # The exported rule wants a doc comment on all 46 methods of Static,
        # Empty, and the null ports. Those are one-line implementations of
        # interfaces documented at length in internal/port, and restating each
        # signature above itself produces noise rather than documentation.
        # Everything with behaviour to explain is documented, and the review
        # for that is human.
        - name: exported
          disabled: true
        # Almost every hit is a parameter whose signature belongs to somebody
        # else: cobra's RunE, a port interface the daemon implements
        # differently, the render function in the shell Spec table. Renaming
        # those to _ would make an implementation read as though the argument
        # were meaningless, which is the opposite of true. The one genuinely
        # dead parameter it found has been removed.
        - name: unused-parameter
          disabled: true
        - name: var-naming

  exclusions:
    rules:
      # Test fixtures are not production code. They hold deliberately
      # misspelled commands (the corrector is tested on `git psuh` and
      # `--set-upsteam`), fake credentials that exist to prove redaction
      # works, world-readable temp files, and subprocess launches that are the
      # point of the end-to-end suite.
      - path: _test\.go
        linters:
          - gosec
          - misspell
          - unparam
          - noctx

      # errcheck on a deferred Close and on printing to a terminal.
      #
      # A deferred Close on a file already read has no error worth acting on,
      # and a failed write to stdout cannot be reported anywhere but stdout.
      # Closes that matter — the ones on a file being written — are checked
      # explicitly in configstore, the index writer, and the event store.
      - linters: [errcheck]
        source: '^\s*defer .*\.Close\(\)$'
      - linters: [errcheck]
        source: '^\s*fmt\.Fprint(f|ln)?\(os\.(Stdout|Stderr)'

      # The daemon's loopback listener and the detached spawn have no request
      # context by construction: the listener outlives every request, and a
      # daemon that died with the shell that started it would defeat its own
      # purpose. Every path that does have a context threads it — which is
      # what contextcheck, still enabled, is there to keep true.
      - path: internal/daemon/(listen_windows|listen_unix|spawn)\.go
        linters: [noctx]

      # The fact prober takes a program name it only ever receives "git" for,
      # because the allowlist holds one program today. The parameter is the
      # seam the allowlist checks against, and collapsing it would move the
      # check somewhere less obvious.
      - path: internal/adapter/facts/facts\.go
        linters: [unparam]

formatters:
  enable:
    - gofmt
