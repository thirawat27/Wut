# Keyless signing via cosign + GitHub OIDC.
# Verify a release with:
#   cosign verify-blob checksums.txt \
#     --certificate checksums.txt.pem \
#     --signature checksums.txt.sig \
#     --certificate-identity-regexp 'https://github.com/thirawat27/wut/.*' \
#     --certificate-oidc-issuer https://token.actions.githubusercontent.com
signs:
  - cmd: cosign
    artifacts: checksum
    certificate: "${artifact}.pem"
    output: true
    args:
      - "sign-blob"
      - "--yes"
      - "--output-certificate=${certificate}"
      - "--output-signature=${signature}"
      - "${artifact}"

# Announcing
announce:
  # Discord
  discord:
    enabled: false
    message_template: "🚀 WUT {{ .Version }} is out! Check it out: {{ .ReleaseURL }}"

  # Twitter/X
  twitter:
    enabled: false
    message_template: "🚀 WUT {{ .Version }} is out! AI-powered command helper for all platforms. {{ .ReleaseURL }}"

  # Mastodon
  mastodon:
    enabled: false
    message_template: "🚀 WUT {{ .Version }} is released! {{ .ReleaseURL }}"
    server: ""
